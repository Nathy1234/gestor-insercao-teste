<style>
  .fb-tabs { display:flex; gap:4px; border-bottom:1px solid var(--border); margin-bottom:18px; flex-wrap:wrap; }
  .fb-tab { padding:9px 14px; font-size:13px; font-weight:600; color:var(--text-muted); text-decoration:none;
            border-bottom:2px solid transparent; margin-bottom:-1px; }
  .fb-tab:hover { color:var(--text); }
  .fb-tab.ativo { color:var(--primary); border-bottom-color:var(--primary); }
  .fb-tag { display:inline-block; font-size:11px; font-weight:600; padding:2px 8px; border-radius:999px;
            border:1px solid var(--border); color:var(--text-muted); white-space:nowrap; }
  .fb-tag.positivo { color:#15803d; border-color:#86efac; background:#16a34a14; }
  .fb-tag.melhoria { color:#b45309; border-color:#fcd34d; background:#d9770614; }
  .fb-tag.misto    { color:#4f46e5; border-color:#c7d2fe; background:#6366f114; }
  .fb-tag.neutro   { color:var(--text-muted); }
  .fb-tag.enviado  { color:#15803d; border-color:#86efac; }
  .fb-tag.pendente { color:var(--text-muted); border-style:dashed; }
  .fb-tag.trello   { color:#0369a1; border-color:#bae6fd; }
  .fb-grid-colab { display:grid; grid-template-columns:repeat(auto-fill,minmax(270px,1fr)); gap:14px; }
  .fb-colab-card { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius);
                   padding:16px; display:flex; flex-direction:column; gap:8px; }
  .fb-colab-nome { font-size:16px; font-weight:700; letter-spacing:.02em; }
  .fb-muted { color:var(--text-muted); font-size:12px; }
  .fb-conteudo { font-size:14px; line-height:1.6; color:var(--text); }
  .fb-conteudo p, .fb-conteudo li { color:var(--text); }
  .fb-papel { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius); padding:22px 26px; }
  .fb-tabela { width:100%; border-collapse:collapse; font-size:13px; }
  .fb-tabela th, .fb-tabela td { padding:8px 10px; border-bottom:1px solid var(--border); text-align:left; vertical-align:middle; }
  .fb-tabela th { font-size:11px; text-transform:uppercase; letter-spacing:.04em; color:var(--text-muted); font-weight:600; }
  .fb-cel { text-align:center !important; }
  .fb-cel a { text-decoration:none; display:inline-flex; align-items:center; justify-content:center;
              width:30px; height:30px; border-radius:8px; font-weight:700; font-size:14px; }
  .fb-cel .ok   { background:#16a34a1f; color:#15803d; }
  .fb-cel .reg  { background:#d977061f; color:#b45309; }
  .fb-cel .novo { color:var(--text-muted); border:1px dashed var(--border); }
  .fb-cel .novo:hover { color:var(--primary); border-color:var(--primary); }
  .fb-legenda { display:flex; gap:16px; flex-wrap:wrap; font-size:12px; color:var(--text-muted); margin:10px 0 0; }
  .fb-acoes { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .fb-acoes form { margin:0; }
  .fb-obs { border-left:3px solid var(--border); padding:6px 0 6px 12px; margin-bottom:10px; }
  .fb-obs.positivo { border-left-color:#16a34a; }
  .fb-obs.melhoria { border-left-color:#d97706; }
  .fb-timeline-item { display:block; text-decoration:none; color:inherit; padding:12px 14px; border:1px solid var(--border);
                      border-radius:var(--radius); background:var(--surface); margin-bottom:10px; }
  .fb-timeline-item:hover { border-color:var(--primary); }
  .fb-timeline-item.arquivado { opacity:.6; }
  .fb-trecho { font-size:12.5px; color:var(--text-muted); margin-top:6px; display:-webkit-box; -webkit-line-clamp:2;
               -webkit-box-orient:vertical; overflow:hidden; }
  .fb-aviso { background:var(--primary-light); border:1px solid var(--primary-ring); border-radius:8px; padding:10px 14px;
              font-size:13px; color:var(--text); }
  /* nomes e links em laranja (sem o azul/roxo padrão do navegador) */
  a.td-link, .fb-muted a, .fb-aviso a, .fb-obs a, a.fb-colab-nome { color:var(--primary); text-decoration:none; }
  a.td-link:hover, .fb-muted a:hover, .fb-aviso a:hover, .fb-obs a:hover, a.fb-colab-nome:hover { text-decoration:underline; }
  .fb-inativar { background:none; border:0; padding:0; font:inherit; font-size:11.5px; color:var(--text-muted); cursor:pointer; }
  .fb-inativar:hover { color:var(--danger); text-decoration:underline; }
  @media (max-width: 900px) { .fb-2col { grid-template-columns:1fr !important; } }
</style>
